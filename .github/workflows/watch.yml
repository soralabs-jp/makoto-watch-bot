name: Watch Cast

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target cast"
        required: false
        default: makoto
        type: choice
        options:
          - makoto
          - miki
      test_notification:
        description: "Send a test notification only"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target || 'makoto' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event.inputs.target || 'makoto' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL_MAKOTO: ${{ secrets.DISCORD_WEBHOOK_URL_MAKOTO || secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_MIKI: ${{ secrets.DISCORD_WEBHOOK_URL_MIKI }}
          TIMEZONE: Asia/Tokyo
          FETCH_TIMEOUT_MS: 60000
          FETCH_RETRY_COUNT: 3
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification || 'false' }}
        run: |
          if [ "$TARGET" = "miki" ]; then
            export DISCORD_WEBHOOK_URL="$DISCORD_WEBHOOK_URL_MIKI"
          else
            export DISCORD_WEBHOOK_URL="$DISCORD_WEBHOOK_URL_MAKOTO"
          fi
          npm start

      - name: Export life-log payload
        if: ${{ github.event.inputs.test_notification != 'true' && (github.event.inputs.target == '' || github.event.inputs.target == 'makoto') }}
        run: npm run export:life-log

      - name: Commit updated snapshots
        if: ${{ github.event.inputs.test_notification != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DATA_PATH="data/${TARGET}"
          if [ -n "$(git status --porcelain -- "$DATA_PATH")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add "$DATA_PATH"
            git commit -m "chore: update ${TARGET} snapshots"
            resolve_snapshot_rebase() {
              if [ ! -d .git/rebase-merge ] && [ ! -d .git/rebase-apply ]; then
                return 1
              fi
              git checkout --theirs -- "$DATA_PATH"
              git add "$DATA_PATH"
              GIT_EDITOR=true git rebase --continue
            }
            if ! git pull --rebase origin main; then
              resolve_snapshot_rebase
            fi
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep 5
              if ! git pull --rebase origin main; then
                resolve_snapshot_rebase
              fi
            done
          fi
